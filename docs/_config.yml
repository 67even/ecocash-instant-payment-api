# ---------------------------------------------------------------------------
# https://67even.github.io/ecocash-instant-payment-api
#
# The content pages in this folder are GENERATED from ../README.md and
# ../reference/ by tools/build_docs.py. Edit the source files and re-run the
# generator - CI fails if they drift.
# ---------------------------------------------------------------------------

title: EcoCash EIP Developer Guide
description: >-
  Integrate the EcoCash Instant Payment (EIP) API step by step: sandbox access,
  Basic auth, charge, lookup and refund, with PHP, Node.js, Python, Java and C#.
lang: en_US

url: https://67even.github.io
baseurl: /ecocash-instant-payment-api
repository: 67even/ecocash-instant-payment-api

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: 67even
logo: "/assets/images/67even-logo.png"

author:
  name: John Mugabe
  url: https://github.com/johnmugabe

social:
  name: 67even
  links:
    - https://github.com/67even
    - https://github.com/67even/ecocash-instant-payment-api

# --- Google Search Console --------------------------------------------------
# Add the property https://67even.github.io/ecocash-instant-payment-api/ in Search Console,
# choose the "HTML tag" method, and paste ONLY the content value here. It is
# rendered on the entry page by _includes/head_custom.html and checked by
# tools/check_meta_tags.py. Then submit /ecocash-instant-payment-api/sitemap.xml.
google_site_verification_token: "1J0N9Y8BUH5i51OK_NqAPKYAay-BURoxm9UmJ1d28I8"

# jekyll-seo-tag is rendered by the theme's head; sitemap needs no include.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# --- search ----------------------------------------------------------------
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# --- links out to the repository -------------------------------------------
aux_links:
  "GitHub":
    - "https://github.com/67even/ecocash-instant-payment-api"
aux_links_new_tab: true

nav_external_links:
  - title: Repository on GitHub
    url: https://github.com/67even/ecocash-instant-payment-api
    hide_icon: false

gh_edit_link: false   # pages are generated; each one links to its source instead

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  MIT licensed. Written and maintained by
  <a href="https://github.com/johnmugabe">John Mugabe</a> under
  <a href="https://github.com/67even">67even</a>. Independent and
  community-maintained - not affiliated with or endorsed by EcoCash Holdings
  Zimbabwe. "EcoCash" and the EcoCash logo belong to their owner.

# --- callouts --------------------------------------------------------------
callouts_level: quiet
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: grey-dk

# --- every page uses the theme's default layout -----------------------------
# just-the-docs ships no _config.yml of its own and Jekyll does not merge theme
# config, so without this every page would render as bare body content.
defaults:
  - scope:
      path: ""
    values:
      layout: default

heading_anchors: true
permalink: pretty

kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
